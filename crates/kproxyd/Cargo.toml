[[bin]]
name = "kproxyd"
path = "src/main.rs"

[dependencies]
kproxy-core.workspace = true
kproxy-store.workspace = true
kproxy-ipc.workspace = true
kproxy-translate.workspace = true
kproxy-kiro.workspace = true
kproxy-pool.workspace = true
kproxy-notify.workspace = true
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
bytes.workspace = true
chromiumoxide = { workspace = true, optional = true }
futures.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
h2.workspace = true
home.workspace = true
rand.workspace = true
reqwest.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tempfile = { workspace = true, optional = true }
