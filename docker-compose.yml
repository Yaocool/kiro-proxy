services:
  kproxyd:
    build:
      context: .
      target: runtime-slim # 支持 runtime-slim 和 runtime-full，runtime-full 支持启用 SSO 浏览器自动登录
      args:
        RUST_VERSION: "1.97.1"
    # Share the host network so proxy services created on arbitrary ports become
    # reachable from the host immediately, without recreating the container.
    network_mode: host
    restart: unless-stopped
    labels:
      io.kiro-proxy.role: daemon
    volumes:
      - kproxy-data:/var/lib/kproxy
    environment:
      RUST_LOG: info

volumes:
  kproxy-data:
