name: kiro-proxy

services:
  kproxyd:
    image: kiro-proxy:latest
    build:
      context: .
      target: runtime-full # 默认包含全部 feature 和 SSO 浏览器；可显式改为 runtime-slim
      args:
        RUST_VERSION: "1.97.1"
        # Keep release builds responsive on smaller hosts; override through
        # CARGO_BUILD_JOBS when more parallelism is safe.
        CARGO_BUILD_JOBS: "${CARGO_BUILD_JOBS:-1}"
    # Share the host network so proxy services created on arbitrary ports become
    # reachable from the host immediately, without recreating the container.
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: "${KPROXY_MEMORY_LIMIT:-1g}"
    pids_limit: ${KPROXY_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: "${KPROXY_DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${KPROXY_DOCKER_LOG_MAX_FILES:-5}"
    labels:
      io.kiro-proxy.role: daemon
    volumes:
      - kproxy-data:/var/lib/kproxy
    environment:
      RUST_LOG: info

volumes:
  kproxy-data:
